name: Bug report
description: A typo, a line that reads wrong, text that overflows, a crash, or a patching problem
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping. Please don't attach or link game images (ISO/BIN) or BIOS files;
        those reports will be closed.
  - type: dropdown
    id: kind
    attributes:
      label: What kind of problem?
      options:
        - Text (typo, wrong meaning, awkward line, name inconsistency)
        - Display (text overflows, overlaps, or is cut off)
        - Untranslated Japanese still showing
        - Crash or freeze
        - The patcher itself (it refused my disc, errored, etc.)
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: Where in the game?
      description: Area, character you were talking to, or what you did just before.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: A screenshot is the most useful thing you can give us. Drag it in here.
  - type: input
    id: version
    attributes:
      label: Patch version
      placeholder: e.g. v1.0.0
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Emulator or hardware, and operating system
      placeholder: e.g. DuckStation 0.1 on Windows 11, or MiSTer PSX core
  - type: textarea
    id: patcher-output
    attributes:
      label: If the patcher failed, paste its message
      render: text
